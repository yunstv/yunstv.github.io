<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灰港 · 开放世界小 demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;color:#e9e4d8;user-select:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  #tr{top:22px;right:26px;text-align:right}
  #clock{font:500 15px/1 "SF Mono",Menlo,monospace;letter-spacing:2px;opacity:.75}
  #cash{font:700 30px/1.3 "SF Mono",Menlo,monospace;color:#e8c36a}
  #heat{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}
  #heat i{width:13px;height:13px;transform:rotate(45deg);border:1.5px solid rgba(233,228,216,.45);box-sizing:border-box}
  #heat i.on{background:#e2553d;border-color:#e2553d;box-shadow:0 0 8px #e2553d}
  #heatLabel{font-size:11px;letter-spacing:3px;opacity:.6;margin-top:7px}
  #bl{left:24px;bottom:24px}
  #map{width:176px;height:176px;border-radius:50%;border:2px solid rgba(233,228,216,.55);background:rgba(10,12,15,.6);display:block}
  #br{right:28px;bottom:26px;text-align:right}
  #speed{font:700 44px/1 "SF Mono",Menlo,monospace}
  #speed small{font-size:13px;font-weight:400;opacity:.65;margin-left:6px;letter-spacing:1px}
  #job{left:216px;bottom:30px;font-size:14px;line-height:1.7;max-width:420px}
  #job b{color:#e8c36a;font-weight:600}
  #prompt{left:50%;bottom:120px;transform:translateX(-50%);font-size:16px;padding:7px 16px;background:rgba(10,12,15,.55);border:1px solid rgba(233,228,216,.3);border-radius:4px;opacity:0;transition:opacity .15s}
  #prompt kbd{display:inline-block;border:1px solid #e9e4d8;border-radius:3px;padding:0 6px;margin-right:6px;font:600 13px/20px Menlo,monospace}
  #toast{left:50%;top:84px;transform:translateX(-50%);font-size:19px;font-weight:600;letter-spacing:1px;opacity:0;transition:opacity .35s;white-space:nowrap}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(8,10,13,.55),rgba(8,10,13,.82));cursor:pointer}
  #start .box{text-align:center}
  #start h1{font-size:76px;letter-spacing:22px;margin:0 0 4px 22px;font-weight:800}
  #start .en{letter-spacing:9px;font-size:13px;opacity:.6;margin-bottom:34px}
  #start table{margin:0 auto 30px;border-spacing:14px 7px;font-size:15px;text-align:left}
  #start td:first-child{text-align:right;color:#e8c36a;font-family:Menlo,monospace;font-size:13px}
  #start .go{display:inline-block;padding:10px 34px;border:1.5px solid #e8c36a;color:#e8c36a;letter-spacing:6px;font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="tr">
  <div id="clock">17:36</div>
  <div id="cash">$ 0</div>
  <div id="heat"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="heatLabel">警戒</div>
</div>
<div class="hud" id="bl"><canvas id="map" width="352" height="352"></canvas></div>
<div class="hud" id="job"></div>
<div class="hud" id="br"><div id="speed" style="display:none">0<small>KM/H</small></div></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="toast"></div>
<div id="fade"></div>

<div id="start">
  <div class="box">
    <h1>灰港</h1>
    <div class="en">GREYPORT · OPEN WORLD DEMO</div>
    <table>
      <tr><td>W A S D</td><td>走路 / 开车</td></tr>
      <tr><td>鼠标</td><td>转视角</td></tr>
      <tr><td>Shift</td><td>跑</td></tr>
      <tr><td>空格</td><td>跳 / 手刹漂移</td></tr>
      <tr><td>F</td><td>上车 / 下车</td></tr>
      <tr><td>T</td><td>按住快进时间（看昼夜）</td></tr>
      <tr><td>R</td><td>卡住时回到路上</td></tr>
      <tr><td>M</td><td>静音</td></tr>
    </table>
    <div class="go">点击开始</div>
  </div>
</div>

<script type="module" src="./game.js"></script>
</body>
</html>
