<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .s1 { stop-color: #FFF59D; }
    .s2 { stop-color: #FFC107; }
    .s3 { stop-color: #F57C00; }
    .ray { stroke: #FFA000; }
    .rim { stroke: #FFECB3; }
    @media (prefers-color-scheme: dark) {
      .s1 { stop-color: #FFF59D; }
      .s2 { stop-color: #FFD54F; }
      .s3 { stop-color: #FFB300; }
      .ray { stroke: #FFCA28; }
      .rim { stroke: #FFE082; }
    }
  </style>
  <defs>
    <radialGradient id="sun" cx="38%" cy="36%" r="62%">
      <stop class="s1" offset="0%"/>
      <stop class="s2" offset="55%"/>
      <stop class="s3" offset="100%"/>
    </radialGradient>
  </defs>

  <g class="ray" stroke-width="3" stroke-linecap="round">
    <line x1="16" y1="2.5" x2="16" y2="6.8"/>
    <line x1="16" y1="25.2" x2="16" y2="29.5"/>
    <line x1="2.5" y1="16" x2="6.8" y2="16"/>
    <line x1="25.2" y1="16" x2="29.5" y2="16"/>
    <line x1="6.6" y1="6.6" x2="9.6" y2="9.6"/>
    <line x1="22.4" y1="22.4" x2="25.4" y2="25.4"/>
    <line x1="6.6" y1="25.4" x2="9.6" y2="22.4"/>
    <line x1="22.4" y1="9.6" x2="25.4" y2="6.6"/>
  </g>

  <circle
    class="rim"
    cx="16" cy="16" r="7.4"
    fill="url(#sun)"
    stroke-width="0.7"
  />
</svg>
